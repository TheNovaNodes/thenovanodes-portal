name: TheNovaNodes Portal CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: 🛡️ Quality Gate (Lint, Test & Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛡️ Audit Dependencies
        run: npm audit --audit-level=high

      - name: 🔍 Run ESLint Linter
        run: npm run lint

      - name: 🧪 Run Vitest Automated Tests
        run: npm test

      - name: 🏗️ Compile Next.js Production Bundle
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
